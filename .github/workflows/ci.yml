# Builds and tests on every pull request and push to main. No signing or
# releases here: the keys stay on the owner's machine (tools/release.sh).
# The Mac AI helper builds in mac-ai.yml.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (data, tests, bench, IBus, Fcitx5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: IBus, GTK 3 and Fcitx5 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libibus-1.0-dev libgtk-3-dev fcitx5-modules-dev \
            libfcitx5core-dev libfcitx5config-dev libfcitx5utils-dev
      - uses: ./.github/actions/sources
      - run: make -j"$(nproc)" all
      - run: make test
      - run: make bench
      - run: make ibus
      - run: make setup
      - run: make fcitx5

  # linux/deb.sh as for a release (it needs only the public key), on each
  # architecture natively, then installed in clean containers of the oldest
  # and newest systems it's for, checked by linux/check-install.sh.
  linux-debs:
    name: Linux .debs (${{ matrix.arch }}, built and installed)
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sources
      - run: linux/deb.sh ${{ matrix.arch }}
      - name: Install them
        run: |
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "::group::$image"
            docker run --rm -v "$PWD":/src:ro "$image" sh -ec '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -qq -y --no-install-recommends /src/dist/*.deb >/dev/null
              /src/linux/check-install.sh
              test -f /etc/apt/sources.list.d/haiku-pinyin.sources
              test -f /etc/apt/keyrings/haiku-pinyin-archive-keyring.gpg
              command -v haiku-pinyin-enable'
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: debs-${{ matrix.arch }}
          path: dist/*.deb
          retention-days: 7

  macos:
    name: macOS (app without AI, tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/sources
      - run: make -j"$(sysctl -n hw.ncpu)" all
      - run: make test
      # The MLX helper takes a long Xcode build; ad hoc signed.
      - run: NO_AI=1 macos/build.sh

  haiku:
    name: Haiku (x86_64 add-on, cross-compiled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The compile half of haiku/cross.sh; packaging needs a Haiku machine.
      # No arm64 here: Haiku publishes cross-compiler images for x86_64 and
      # x86_gcc2h only (arm64 is a nightly-only port), so the arm64 add-on
      # is built on a Haiku VM (tools/release.sh).
      - name: Cross-compile the add-on
        run: |
          docker run --rm -v "$PWD":/src -w /src \
            ghcr.io/haiku/cross-compiler:x86_64-r1beta5 sh -ec '
              cxx=x86_64-unknown-haiku-g++
              out=build/x86_64
              mkdir -p $out
              for f in engine/*.cpp haiku/*.cpp; do
                $cxx -O2 -std=c++17 -fPIC -Wall -Wno-multichar \
                  -c $f -o $out/$(basename $f .cpp).o
              done
              $cxx -shared -o $out/HaikuPinyin $out/*.o -lbe -ltracker
              ls -l $out/HaikuPinyin'
