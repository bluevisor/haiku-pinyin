# The download page, bluevisor.github.io/haiku-pinyin: site/ as it is, with
# the screenshot and icon copied in beside it. No build step. Deploys from
# main when the page (or what it copies) changes, or by hand.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/screenshot.png
      - linux/icon.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Assemble
        run: |
          mkdir -p _site
          cp -R site/. _site/
          cp docs/screenshot.png linux/icon.svg _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
